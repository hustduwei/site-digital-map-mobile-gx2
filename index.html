<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07111e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="工地数字地图" />
  <title>工地数字地图移动端标准版</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" as="image" href="img/site-map.jpg?v=20261029d" />
  <link rel="stylesheet" href="css/app.css?v=20261029za94" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js", { scope: "./", updateViaCache: "none" });
      });
    }
  </script>
</head>
<body>
  <div class="stage">
    <div class="stage-title">工地数字地图 · 移动端标准版</div>
    <div class="phone">
      <div class="phone-screen">
        <div class="map-land" id="mapLand" aria-hidden="true" hidden>
          <div class="map-land-stage">
            <div class="map-land-fit">
              <img src="img/site-map.jpg?v=20261029d" alt="工地数字地图" />
              <div class="alarm-pins" id="landAlarmPins"></div>
            </div>
          </div>
          <div class="land-top">
            <div class="land-brand">
              <div class="land-project">高新二路项目智能建造管理平台</div>
              <div class="home-progress">
                <div class="home-progress-hd">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l3 1.6"/></svg>
                  项目总进度 <b>53%</b>
                </div>
                <span class="home-progress-bar"><i></i></span>
              </div>
            </div>
            <div class="land-actions">
              <button class="map-land-back" id="btnMapBack" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
                返回
              </button>
            </div>
          </div>
          <button class="map-land-flat" id="btnMapFlat" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 14.5 8.2 11l3 2.4L15 9.5 20 14"/></svg>
            二维地图
          </button>
        </div>
        <div class="cam-player" id="camPlayer" aria-hidden="true" hidden>
          <div class="cam-player-bar">
            <button class="cam-player-back" id="btnCamBack" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
              返回
            </button>
            <strong id="camPlayerName">视频监控</strong>
            <span class="cam-live" id="camLive">直播中</span>
          </div>
          <div class="cam-live-view" id="camLiveView">
            <div class="cam-player-stage" id="camPlayerStage">
              <img id="camPlayerFrame" alt="" />
              <span class="cam-time" id="camPlayerTime"></span>
              <button class="cam-play" id="btnCamPlay" type="button" aria-label="播放"></button>
              <div class="cam-stage-acts">
                <button class="cam-stage-btn" id="btnCamShots" type="button">历史抓拍</button>
                <button class="home-full" id="btnCamLand" type="button">
                  <svg class="cam-land-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 5H5v3M16 5h3v3M8 19H5v-3M16 19h3v-3"/></svg>
                  <svg class="cam-land-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5v4H5M15 5v4h4M9 19v-4H5M15 19v-4h4"/></svg>
                  <span id="camLandText">全屏</span>
                </button>
              </div>
            </div>
            <div class="cam-player-switch">
              <p>切换点位</p>
              <div class="cam-player-chips" id="camPlayerChips"></div>
            </div>
          </div>
          <div class="cam-shots-view hide" id="camShotsView">
            <div class="cam-shots">
              <div class="cam-shots-hd">
                <strong>历史抓拍</strong>
                <span>每天 3 张，点开查看照片</span>
              </div>
              <div class="cam-shot-days" id="camShotDays"></div>
              <div class="cam-shot-grid" id="camShotGrid"></div>
            </div>
            <div class="cam-cal hide" id="camCal">
              <div class="cam-cal-hd">
                <button class="cam-cal-nav" id="camCalPrev" type="button" aria-label="上一月">‹</button>
                <strong id="camCalTitle">2026年10月</strong>
                <button class="cam-cal-nav" id="camCalNext" type="button" aria-label="下一月">›</button>
              </div>
              <div class="cam-cal-week">
                <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
              </div>
              <div class="cam-cal-grid" id="camCalGrid"></div>
            </div>
          </div>
            <div class="cam-shot-pop" id="camShotPop" aria-hidden="true" hidden>
            <button class="cam-shot-close" id="btnShotClose" type="button">关闭</button>
            <img id="camShotImg" alt="" />
            <p id="camShotMeta"></p>
          </div>
        </div>
        <div class="air-player" id="airPlayer" aria-hidden="true" hidden>
          <div class="cam-player-bar">
            <button class="cam-player-back" id="btnAirBack" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
              返回
            </button>
            <strong>航拍照片</strong>
          </div>
          <div class="air-days" id="airDays"></div>
          <div class="cam-cal hide" id="airCal">
            <div class="cam-cal-hd">
              <button class="cam-cal-nav" id="airCalPrev" type="button" aria-label="上一月">‹</button>
              <strong id="airCalTitle">2026年10月</strong>
              <button class="cam-cal-nav" id="airCalNext" type="button" aria-label="下一月">›</button>
            </div>
            <div class="cam-cal-week">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="cam-cal-grid" id="airCalGrid"></div>
          </div>
          <p class="air-hint" id="airHint">无人机定点拍摄</p>
          <div class="air-grid" id="airGrid"></div>
          <div class="cam-shot-pop air-pop" id="airPop" aria-hidden="true" hidden>
            <button class="cam-shot-close" id="btnAirClose" type="button">关闭</button>
            <img id="airPopImg" alt="" />
            <p id="airPopMeta"></p>
          </div>
        </div>
        <div class="hazard-page" id="hazardPage" aria-hidden="true" hidden>
          <div class="cam-player-bar">
            <button class="cam-player-back" id="btnHazardBack" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
              返回
            </button>
            <strong>隐患上报</strong>
          </div>
          <div class="hazard-body">
            <section class="hazard-sec">
              <h4>现场照片 <em>最多 6 张，可拍照或从相册选择</em></h4>
              <div class="hazard-photos" id="hazardPhotos"></div>
              <input id="hazardFile" type="file" accept="image/*" multiple hidden />
            </section>
            <section class="hazard-sec">
              <h4>隐患类型</h4>
              <div class="hazard-types" id="hazardTypes"></div>
            </section>
            <section class="hazard-sec">
              <h4>问题描述</h4>
              <textarea class="hazard-area" id="hazardDesc" rows="4" placeholder="补充隐患说明，便于整改跟进"></textarea>
            </section>
            <button class="hazard-submit" id="btnHazardSubmit" type="button">提交上报</button>
          </div>
        </div>
        <div class="app home-mode" id="app">
          <div class="stack">
            <nav class="navbar">
              <div class="nav-side" id="navLeft"></div>
              <h1 class="nav-title" id="navTitle">首页</h1>
              <div class="nav-side right" id="navRight"></div>
            </nav>

            <main class="pages">
              <section class="page home-page active is-sheet-full" id="page-home">
                <div class="home-scene">
                  <div class="home-map" role="img" aria-label="工地数字地图">
                    <div class="alarm-pins" id="homeAlarmPins"></div>
                  </div>
                  <div class="home-top">
                    <div class="home-project-row">
                      <div class="home-project">高新二路项目智能建造管理平台</div>
                      <button class="home-full" id="btnMapFull" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 5H5v3M16 5h3v3M8 19H5v-3M16 19h3v-3"/></svg>
                        全屏
                      </button>
                    </div>
                    <div class="home-progress">
                      <div class="home-progress-hd">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.2l3 1.6"/></svg>
                        项目总进度 <b>53%</b>
                      </div>
                      <span class="home-progress-bar"><i></i></span>
                    </div>
                  </div>
                </div>
                <div class="home-sheet" id="homeSheet">
                  <div class="home-sheet-handle" id="sheetHandle" role="button" aria-label="拖动调整浮窗"></div>
                  <div class="home-mods" id="homeMods">
                    <button class="home-mod on" data-mod="safety" type="button">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.2 4.6H4.8v3.4M15.8 4.6h3.4v3.4M8.2 19.4H4.8v-3.4M15.8 19.4h3.4v-3.4"/><path d="M7.2 12s2.2-3.4 4.8-3.4 4.8 3.4 4.8 3.4-2.2 3.4-4.8 3.4S7.2 12 7.2 12z"/><circle cx="12" cy="12" r="1.5"/></svg>
                      智眸
                    </button>
                    <button class="home-mod" data-mod="progress" type="button">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="5.2" width="11.2" height="14.4" rx="2"/><path d="M9.2 5.2V4.2h5.6v1"/><path d="M8.9 12.6 10.8 14.5l4.2-4.5"/></svg>
                      智巡
                    </button>
                    <button class="home-mod" data-mod="equip" type="button">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6.4" y="7.6" width="11.2" height="9.4" rx="2.2"/><circle cx="10" cy="12.2" r="1.15"/><circle cx="14" cy="12.2" r="1.15"/><path d="M12 7.6V4.8M12 4.8h2.4M8.4 17v2.4M15.6 17v2.4"/></svg>
                      智控
                    </button>
                  </div>
                  <div class="home-panels" id="homePanels"></div>
                </div>
              </section>

              <section class="page work-page" id="page-work">
                <div class="work-shorts" id="workShorts">
                  <button class="work-short" type="button" data-work="cam">
                    <i class="blue">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8.2h10.2v9.2H4.5z"/><path d="M14.7 11.2 19.5 8.8v8.2l-4.8-2.4z"/></svg>
                    </i>
                    <span>视频监控</span>
                  </button>
                  <button class="work-short" type="button" data-work="photo">
                    <i class="green">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.2" cy="6.2" r="2"/><circle cx="17.8" cy="6.2" r="2"/><circle cx="6.2" cy="17.8" r="2"/><circle cx="17.8" cy="17.8" r="2"/><path d="M8.2 6.2h7.6M8.2 17.8h7.6M6.2 8.2v7.6M17.8 8.2v7.6"/><rect x="10" y="10" width="4" height="4" rx="0.8"/></svg>
                    </i>
                    <span>航拍照片</span>
                  </button>
                  <button class="work-short" type="button" data-work="hazard">
                    <i class="orange">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 9.2h3.1l1.3-2.2h6.4l1.3 2.2h3.1v9.2H4.4z"/><circle cx="12" cy="13.9" r="3.1"/></svg>
                    </i>
                    <span>隐患上报</span>
                  </button>
                  <button class="work-short" type="button" data-work="todo2">
                    <i class="gray">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="3" stroke-dasharray="3 3"/><path d="M12 9v6M9 12h6"/></svg>
                    </i>
                    <span>待定</span>
                  </button>
                </div>
                <div class="tool-list">
                  <div class="tool-card">
                    <div class="tool-ico blue">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="6.2" height="17" rx="1.2"/><rect x="13.3" y="3.5" width="6.2" height="17" rx="1.2"/><path d="M7.6 9.2v-2.4M7.6 9.2l-1.2-1.2M7.6 9.2l1.2-1.2M16.4 14.8v2.4M16.4 14.8l-1.2 1.2M16.4 14.8l1.2 1.2"/></svg>
                    </div>
                    <div class="tool-meta">
                      <strong>垂直运输调度系统</strong>
                      <p>施工电梯/塔机垂直运输调度</p>
                    </div>
                    <span class="tool-arrow">›</span>
                  </div>
                  <div class="tool-card">
                    <div class="tool-ico green">
                      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.5h2.2l1.6-4.2h8.2L18 14.5h2"/><path d="M5 14.5v3.2h14V14.5"/><circle cx="8" cy="18.2" r="1.4"/><circle cx="16" cy="18.2" r="1.4"/><path d="M7.8 10.3 9 7.8h6.2"/></svg>
                    </div>
                    <div class="tool-meta">
                      <strong>水平调度系统</strong>
                      <p>车辆出入场调度管理</p>
                    </div>
                    <span class="tool-arrow">›</span>
                  </div>
                </div>
              </section>

              <section class="page" id="page-msg">
                <div class="card msg-list" id="msgList"></div>
              </section>

              <section class="page" id="page-mine">
                <div class="profile-banner">
                  <div class="avatar">张</div>
                  <div>
                    <h3>张工 <span class="role-tag">安全员</span></h3>
                    <p>高新二路项目智能建造管理平台</p>
                  </div>
                </div>
                <div class="card" id="mineMenu"></div>
                <button class="logout-btn" id="btnLogout" type="button">退出登录</button>
              </section>
            </main>

            <section class="subpage" id="subpage">
              <nav class="navbar">
                <div class="nav-side">
                  <button class="nav-btn" id="btnBack">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
                  </button>
                </div>
                <h1 class="nav-title" id="subTitle">详情</h1>
                <div class="nav-side right">
                  <button class="nav-btn nav-report" id="btnCraneReport" type="button" hidden>日报</button>
                </div>
              </nav>
              <div class="subpage-body" id="subBody"></div>
            </section>
          </div>

          <div class="people-pop" id="peoplePop" aria-hidden="true">
            <button class="people-pop-mask" type="button" data-people-close aria-label="关闭"></button>
            <div class="people-pop-panel" role="dialog" aria-modal="true" aria-labelledby="peoplePopTitle">
              <div class="people-pop-grip" aria-hidden="true"></div>
              <div id="peoplePopBody"></div>
            </div>
          </div>

          <nav class="tabbar" id="tabbar">
            <button class="tab active" data-tab="home">
              <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
              <span>首页</span>
            </button>
            <button class="tab" data-tab="work">
              <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg>
              <span>工作台</span>
            </button>
            <button class="tab" data-tab="msg">
              <svg viewBox="0 0 24 24"><path d="M5 5.5h14v10.5H8.5L5 19.5V5.5z"/></svg>
              <span>消息</span>
              <b class="badge">2</b>
            </button>
            <button class="tab" data-tab="mine">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5.5 19.5c1.2-3.2 3.6-4.7 6.5-4.7s5.3 1.5 6.5 4.7"/></svg>
              <span>我的</span>
            </button>
          </nav>
        </div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>
  <script src="js/app.js?v=20261029za108"></script>
</body>
</html>
